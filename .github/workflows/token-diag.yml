name: Token diagnostic (temporary)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: What does the feed token see?
        env:
          ECWID_TOKEN: ${{ secrets.ECWID_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request
          tok = os.environ["ECWID_TOKEN"]
          print("token type prefix:", tok.split("_")[0] + "_", "| length:", len(tok))
          H = {"Authorization": "Bearer " + tok, "Accept": "application/json", "User-Agent": "jc-diag"}
          def get(path):
              try:
                  with urllib.request.urlopen(urllib.request.Request("https://app.ecwid.com/api/v3/77567544/" + path, headers=H), timeout=60) as r:
                      return r.status, json.loads(r.read().decode())
              except urllib.error.HTTPError as e:
                  return e.code, e.read().decode()[:200]
          s, d = get("products?sku=1002110035&enabled=true")
          print("K2 Plus lookup status:", s)
          if s == 200:
              for p in d.get("items", []):
                  print(" visibility:", p.get("outOfStockVisibilityBehaviour"), "| attrs:", [(a.get("name"), a.get("value"), a.get("show")) for a in p.get("attributes", [])])
          s, d = get("profile")
          print("profile status:", s)
          s, d = get("products?limit=1")
          print("products status:", s, "| total:", d.get("total") if s == 200 else d)
          PY
